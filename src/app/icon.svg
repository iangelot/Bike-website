<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RAGERIDE">
  <!-- The brand icon Google shows in the little circle beside a result, and the
       browser tab. The wordmark is too wide to read at 16px, so the favicon is
       a monogram in the brand colours: gold R on the near-black navy. -->
  <rect width="512" height="512" rx="112" fill="#001a34"/>
  <text x="50%" y="52%" dominant-baseline="central" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900"
        font-size="340" fill="#f4bf1f">R</text>
</svg>
